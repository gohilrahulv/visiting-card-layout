<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>60 – Visiting Cards</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --navy: #1d4a7a;
            --dnavy: #12304f;
            --gold: #b8923a;
            --lgold: #e3c577;
            --beige: #e4d8c3;
            --bg: #f4f1ea;
            --ink: #222;
            --panel: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #1b1b1b;
                --ink: #eee;
                --panel: #2a2a2a
            }
        }

        :root[data-theme="dark"] {
            --bg: #1b1b1b;
            --ink: #eee;
            --panel: #2a2a2a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Poppins, system-ui, sans-serif;
            padding: 16px
        }

        h1 {
            font-family: Cinzel, serif;
            font-size: 20px;
            margin: 0 0 4px
        }

        p.s {
            margin: 0 0 14px;
            font-size: 13px;
            opacity: .7
        }

        .ed {
            background: var(--panel);
            border-radius: 12px;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto 20px
        }

        .ed label {
            font-size: 12px;
            opacity: .7;
            display: block;
            margin-bottom: 3px
        }

        .ed input,
        .ed textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #9995;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: 14px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 22px;
            max-width: 1000px;
            margin: 0 auto;
            justify-items: center
        }

        .wrap {
            max-width: 100%;
            overflow-x: auto
        }

        .t {
            font-size: 13px;
            margin: 6px 0;
            text-align: center;
            opacity: .8
        }

        button {
            background: var(--navy);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 7px 14px;
            font: inherit;
            font-size: 13px;
            cursor: pointer
        }

        .card {
            width: 525px;
            height: 300px;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 4px 16px #0004;
            font-family: 'Cormorant Garamond', serif;
            flex: none
        }

        .card .nm {
            font-family: Cinzel, serif;
            font-weight: 800;
            letter-spacing: 1px
        }

        .logo {
            border-radius: 50%;
            object-fit: cover;
            display: block
        }

        .sm {
            font-family: Poppins, sans-serif;
            font-size: 11.5px;
            line-height: 1.5
        }

        /* 1 classic */
        .c1 {
            background: var(--beige);
            color: var(--navy);
            border: 3px double var(--gold);
            outline: 6px solid var(--beige);
            outline-offset: -12px
        }

        .c1 .logo {
            position: absolute;
            left: 28px;
            top: 28px;
            width: 110px;
            height: 110px
        }

        .c1 .a {
            position: absolute;
            left: 160px;
            top: 34px;
            right: 24px
        }

        .c1 .nm {
            font-size: 30px;
            line-height: 1.1
        }

        .c1 .tg {
            color: var(--gold);
            font-size: 17px;
            font-weight: 700;
            margin-top: 6px
        }

        .c1 .b {
            position: absolute;
            left: 28px;
            right: 28px;
            bottom: 22px;
            border-top: 1.5px solid var(--gold);
            padding-top: 10px
        }

        /* 2 dark */
        .c2 {
            background: radial-gradient(circle at 80% 30%, #1f5a94, var(--dns, #12304f) 70%);
            color: var(--lgold);
            border: 2px solid var(--gold)
        }

        .c2 .logo {
            position: absolute;
            right: 30px;
            top: 30px;
            width: 120px;
            height: 120px;
            border: 2px solid var(--gold)
        }

        .c2 .a {
            position: absolute;
            left: 30px;
            top: 36px;
            width: 310px
        }

        .c2 .nm {
            font-size: 30px;
            line-height: 1.15
        }

        .c2 .tg {
            font-size: 17px;
            color: #fff;
            margin-top: 6px
        }

        .c2 .b {
            position: absolute;
            left: 30px;
            right: 30px;
            bottom: 24px;
            color: #f1e6c8
        }

        .c2 .b:before {
            content: "";
            display: block;
            height: 1px;
            background: var(--gold);
            margin-bottom: 10px
        }

        /* 3 split */
        .c3 {
            background: var(--beige);
            color: var(--navy);
            display: flex
        }

        .c3 .l {
            width: 170px;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 4px solid var(--gold)
        }

        .c3 .logo {
            width: 130px;
            height: 130px;
            border: 3px solid var(--gold)
        }

        .c3 .r {
            flex: 1;
            padding: 26px 22px
        }

        .c3 .nm {
            font-size: 27px
        }

        .c3 .tg {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            margin: 4px 0 14px
        }

        /* 4 centered arch */
        .c4 {
            background: var(--beige);
            color: var(--navy);
            text-align: center;
            border: 2px solid var(--navy)
        }

        .c4:before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1.5px solid var(--gold);
            border-radius: 4px
        }

        .c4 .logo {
            width: 84px;
            height: 84px;
            margin: 20px auto 6px
        }

        .c4 .nm {
            font-size: 27px
        }

        .c4 .tg {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            margin: 2px 0 8px
        }

        .c4 .sm {
            position: relative
        }

        /* 5 watermark */
        .c5 {
            background: var(--beige);
            color: var(--navy)
        }

        .c5 .wm {
            position: absolute;
            right: -60px;
            top: -30px;
            width: 360px;
            height: 360px;
            opacity: .22
        }

        .c5 .bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 12px;
            background: linear-gradient(var(--navy), var(--gold))
        }

        .c5 .a {
            position: absolute;
            left: 38px;
            top: 34px
        }

        .c5 .nm {
            font-size: 34px
        }

        .c5 .tg {
            font-size: 18px;
            color: var(--gold);
            font-weight: 700;
            margin-top: 4px
        }

        .c5 .b {
            position: absolute;
            left: 38px;
            bottom: 26px;
            right: 30px;
            font-weight: 500
        }

        .c5 .gst {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 10px;
            font-family: Poppins;
            opacity: .8
        }

        .tx {
            display: flex;
            gap: 6px;
            align-items: flex-start
        }

        .tx i {
            font-style: normal;
            color: var(--gold);
            width: 16px
        }

        .tx i {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            flex: none;
            margin-top: 1px
        }

        .tx i svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .own {
            font-family: Poppins, sans-serif;
            font-size: 11px;
            margin-top: 5px;
            opacity: .9
        }

        .own span {
            font-weight: 500
        }

        .spec {
            font-size: 14px;
            font-style: italic;
            margin-top: 3px;
            opacity: .9
        }

        .dv {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            color: var(--gold)
        }

        .dv b {
            flex: 1;
            height: 1px;
            background: currentColor;
            opacity: .7
        }

        .dv u {
            text-decoration: none;
            font-size: 11px
        }

        .cr {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid var(--gold)
        }

        .cr.tl {
            top: 9px;
            left: 9px;
            border-right: 0;
            border-bottom: 0
        }

        .cr.tr {
            top: 9px;
            right: 9px;
            border-left: 0;
            border-bottom: 0
        }

        .cr.bl2 {
            bottom: 9px;
            left: 9px;
            border-right: 0;
            border-top: 0
        }

        .cr.br2 {
            bottom: 9px;
            right: 9px;
            border-left: 0;
            border-top: 0
        }

        .c4 .logo {
            width: 72px;
            height: 72px;
            margin: 16px auto 4px
        }

        .c4 .dv {
            width: 60%;
            margin: 6px auto
        }

        .c3 .r {
            padding: 20px 20px
        }

        .bk {
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 30px !important;
            text-align: left !important
        }

        .bk .bl {
            flex: 1;
            min-width: 0
        }

        .bk .br {
            text-align: center
        }

        .bk .logo {
            position: static !important;
            width: 52px !important;
            height: 52px !important;
            margin: 0 0 6px !important;
            border: 2px solid var(--gold)
        }

        .qr {
            background: #fff;
            padding: 6px;
            border-radius: 6px;
            width: 108px;
            height: 108px;
            margin: 0 auto
        }

        .qr img,
        .qr canvas {
            display: block
        }

        .qt {
            font-size: 10px;
            margin-top: 6px
        }

        .tg2 {
            font-size: 15px;
            color: var(--gold);
            font-weight: 700
        }

        .c2 .tg2 {
            color: #fff
        }

        .c3.bk {
            background: var(--navy);
            color: var(--lgold)
        }

        .c3.bk .tg2 {
            color: #fff
        }

        .btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px
        }

        .btns .alt {
            background: var(--gold)
        }

        .hl {
            font-family: Poppins, sans-serif;
            font-size: 10.5px;
            margin-top: 6px;
            opacity: .9;
            letter-spacing: .3px
        }

        .bk .dv {
            margin: 5px 0
        }

        /* 6 bridal maroon mandala */
        .c6 {
            background: radial-gradient(circle at 80% 50%, #7a1a2e, #4a0c1a 75%);
            color: #f0d9a0;
            border: 2px solid var(--gold)
        }

        .c6 .md {
            position: absolute;
            right: -70px;
            top: -20px;
            width: 340px;
            height: 340px;
            opacity: .55
        }

        .c6 .logo {
            position: absolute;
            right: 42px;
            top: 90px;
            width: 120px;
            height: 120px;
            border: 3px solid var(--gold)
        }

        .c6 .a {
            position: absolute;
            left: 28px;
            top: 30px;
            width: 260px
        }

        .c6 .nm {
            font-size: 29px;
            line-height: 1.15;
            color: #f6e3a8
        }

        .c6 .tg {
            font-size: 16px;
            color: #fff;
            margin-top: 5px
        }

        .c6 .b {
            position: absolute;
            left: 28px;
            bottom: 22px;
            width: 300px
        }

        .c6 .tx i {
            color: #e3c577
        }

        .c6 .tg2 {
            color: #fff
        }

        /* 7 hang tag (vertical) */
        .c7 {
            width: 300px;
            height: 525px;
            background: #e0cfae;
            color: var(--navy);
            border-radius: 16px 16px 6px 6px;
            text-align: center
        }

        .c7:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 30px;
            background: radial-gradient(circle, #e3c577 2.2px, transparent 2.8px) 0 0/17px 17px, var(--navy)
        }

        .c7 .str {
            position: absolute;
            left: 50%;
            top: 0;
            height: 28px;
            width: 2px;
            margin-left: -1px;
            background: var(--navy)
        }

        .c7 .hole {
            position: absolute;
            left: 50%;
            top: 17px;
            width: 22px;
            height: 22px;
            margin-left: -11px;
            border-radius: 50%;
            background: #f4f1ea;
            box-shadow: inset 0 0 0 3px var(--gold)
        }

        .c7 .logo {
            width: 128px;
            height: 128px;
            margin: 60px auto 12px;
            border: 3px solid var(--gold)
        }

        .c7 .nm {
            font-size: 27px
        }

        .c7 .tg {
            color: var(--gold);
            font-size: 17px;
            font-weight: 700;
            margin: 3px 18px 0
        }

        .c7 .dv {
            width: 70%;
            margin: 12px auto
        }

        .c7 .sm {
            text-align: left;
            width: 232px;
            margin: 0 auto
        }

        .c7.bk {
            flex-direction: column;
            justify-content: center;
            padding: 40px 24px 44px !important
        }

        .c7.bk .bl {
            flex: none;
            text-align: center;
            width: 100%
        }

        .c7.bk .sm {
            width: 210px;
            margin: 0 auto
        }

        .c7.bk .logo {
            margin: 0 auto 6px !important
        }

        /* 8 bandhani */
        .c8 {
            background: #f7f0e1;
            color: var(--navy)
        }

        .c8:before,
        .c8:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 34px;
            background: radial-gradient(circle, #e3c577 2.2px, transparent 2.8px) 0 0/17px 17px, var(--navy)
        }

        .c8:before {
            top: 0
        }

        .c8:after {
            bottom: 0
        }

        .c8 .logo {
            position: absolute;
            left: 30px;
            top: 56px;
            width: 112px;
            height: 112px;
            border: 3px solid var(--navy);
            outline: 2px solid var(--gold);
            outline-offset: 3px
        }

        .c8 .a {
            position: absolute;
            left: 172px;
            top: 52px;
            right: 22px
        }

        .c8 .nm {
            font-size: 28px;
            line-height: 1.1
        }

        .c8 .tg {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            margin-top: 4px
        }

        .c8 .b {
            position: absolute;
            left: 30px;
            right: 24px;
            top: 184px
        }

        .c8.bk {
            padding: 46px 30px !important
        }

        /* 9 minimal monogram */
        .c9 {
            background: #fbf9f4;
            color: var(--dnavy);
            border: 1px solid #cfc7b4
        }

        .c9 .mono {
            position: absolute;
            left: 30px;
            top: 48px;
            width: 124px;
            height: 124px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Cinzel, serif;
            font-size: 42px;
            font-weight: 600;
            color: var(--navy);
            letter-spacing: 2px
        }

        .c9 .logo {
            position: absolute;
            left: 69px;
            top: 196px;
            width: 46px;
            height: 46px
        }

        .c9 .vl {
            position: absolute;
            left: 184px;
            top: 34px;
            bottom: 34px;
            width: 1px;
            background: var(--gold)
        }

        .c9 .a {
            position: absolute;
            left: 206px;
            top: 34px;
            right: 22px
        }

        .c9 .nm {
            font-size: 21px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600
        }

        .c9 .tg {
            font-family: Poppins, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-top: 7px
        }

        .c9 .b {
            position: absolute;
            left: 206px;
            right: 22px;
            bottom: 28px
        }

        /* 10 black gold luxe */
        .c10 {
            background: #0f0f10;
            color: #e9d9a8
        }

        .c10:after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 230px;
            background: linear-gradient(135deg, #f3dc93, #b8923a 55%, #7a5c1c);
            clip-path: polygon(28% 0, 100% 0, 100% 100%, 0 100%)
        }

        .c10 .logo {
            position: absolute;
            right: 42px;
            top: 78px;
            width: 118px;
            height: 118px;
            border: 4px solid #0f0f10;
            z-index: 2
        }

        .c10 .a {
            position: absolute;
            left: 28px;
            top: 30px;
            width: 260px
        }

        .c10 .nm {
            font-size: 29px;
            line-height: 1.15;
            color: #e8c872
        }

        .c10 .tg {
            font-size: 16px;
            color: #fff;
            margin-top: 5px
        }

        .c10 .b {
            position: absolute;
            left: 28px;
            bottom: 22px;
            width: 255px
        }

        .c10 .tx i {
            color: #e8c872
        }

        .c10 .tg2 {
            color: #fff
        }

        .c10 .bl,
        .c10 .br {
            position: relative;
            z-index: 2
        }

        .c10.bk .logo {
            border-color: #e8c872 !important;
            z-index: 2
        }

        .ed select {
            width: 100%;
            padding: 8px;
            border: 1px solid #9995;
            border-radius: 8px;
            background: var(--panel);
            color: inherit;
            font: inherit;
            font-size: 14px
        }

        .ed .qb {
            align-self: end
        }

        /* Series 3 : 50 designs = 10 layouts x palettes */
        .g {
            --bg: #e4d8c3;
            --fg: #1d4a7a;
            --ac: #b8923a;
            --dk: #12304f;
            --lt: #e3c577;
            background: var(--bg);
            color: var(--fg)
        }

        .g .tx i {
            color: var(--ac)
        }

        .g.bk {
            background: var(--dk);
            color: var(--lt);
            box-shadow: inset 0 0 0 6px var(--dk), inset 0 0 0 7.5px var(--ac)
        }

        .g.bk:before,
        .g.bk:after {
            display: none
        }

        .g.bk .tg2 {
            color: #fff
        }

        .g.bk .logo {
            border-color: var(--ac) !important
        }

        .g1 .tp {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 112px;
            background: var(--dk);
            padding: 22px 150px 0 30px
        }

        .g1 .nm {
            font-size: 28px;
            line-height: 1.1;
            color: var(--lt)
        }

        .g1 .tg {
            color: #fff;
            font-size: 15px;
            margin-top: 3px
        }

        .g1 .logo {
            position: absolute;
            right: 30px;
            top: 58px;
            width: 96px;
            height: 96px;
            border: 4px solid var(--bg)
        }

        .g1 .b {
            position: absolute;
            left: 30px;
            top: 128px;
            right: 150px
        }

        .g2:before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--dk);
            clip-path: polygon(0 0, 100% 0, 100% 40%, 0 62%)
        }

        .g2 .a {
            position: absolute;
            left: 30px;
            top: 26px;
            width: 300px
        }

        .g2 .nm {
            color: var(--lt);
            font-size: 28px;
            line-height: 1.1
        }

        .g2 .tg {
            color: #fff;
            font-size: 15px;
            margin-top: 4px
        }

        .g2 .own {
            color: var(--lt)
        }

        .g2 .logo {
            position: absolute;
            right: 34px;
            top: 42px;
            width: 104px;
            height: 104px;
            border: 4px solid var(--bg)
        }

        .g2 .b {
            position: absolute;
            left: 30px;
            right: 30px;
            bottom: 18px
        }

        .g3 {
            border: 12px solid var(--dk)
        }

        .g3:before {
            content: "";
            position: absolute;
            inset: 4px;
            border: 1.5px solid var(--ac)
        }

        .g3 .logo {
            position: absolute;
            left: 50%;
            top: 16px;
            margin-left: -34px;
            width: 68px;
            height: 68px
        }

        .g3>.nm {
            position: absolute;
            left: 0;
            right: 0;
            top: 90px;
            text-align: center;
            font-size: 26px
        }

        .g3>.tg {
            position: absolute;
            left: 0;
            right: 0;
            top: 124px;
            text-align: center;
            color: var(--ac);
            font-size: 16px;
            font-weight: 700
        }

        .g3>.own {
            position: absolute;

    <p class="s">Details edit karo – saare 60 cards (front + back) ek saath update honge. Jo field khali hogi wo card se
        hide ho jayegi. Back me WhatsApp QR bhi hai.</p>

        <div><label>Shop Name</label><input data-k="name" value="ABC Name"></div>

        <div><label>Mobile</label><input data-k="ph" value="1234567890"></div>
        <div><label>GST No.</label><input data-k="gst" value="09ABCDE1234F1Z5"></div>
        <div style="grid-column:1/-1"><label>Address</label><textarea data-k="addr"
                rows="2">46, 48 – Shubham Textile Hub, Pipodra, Surat – 394110</textarea></div>

        <div><label>Email</label><input data-k="mail" placeholder="email@gmail.com"></div>

        </div>
        <div><label>Highlights (back side)</label><input data-k="hl" value="Ready Stock • Custom Sizes • Bulk Orders">
        </div>

                <option value="insta">Instagram</option>
                <option value="map">Google Maps location (address se)</option>
